[[permission]]
identifier = "allow-storage-commands"
description = "Enables history and technology JSON persistence commands."
commands.allow = [
  "history_list",
  "history_add",
  "history_remove",
  "history_replace",
  "technologies_list",
  "technologies_add",
  "technologies_remove",
  "technologies_replace",
  "unimed_n_list",
  "unimed_n_add",
  "unimed_n_remove",
  "unimed_n_replace",
  "table_load",
  "zoom_get",
  "zoom_set",
  "zoom_adjust",
  "export_pdf",
]

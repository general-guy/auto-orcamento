[package]
name = "auto-orcamento"
version = "0.1.0"
description = "Gerador local de orçamentos cirúrgicos"
authors = ["general-guy"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "auto_orcamento_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Auto Orçamento</title>
    <style>
      body {
        align-items: center;
        background: #fafafa;
        color: #1f2933;
        display: flex;
        font-family: Arial, Helvetica, sans-serif;
        height: 100vh;
        justify-content: center;
        margin: 0;
      }

      p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <p>Carregando Auto Orçamento...</p>
    <script>
      const target = "http://127.0.0.1:3000";

      function tryConnect() {
        const probe = new Image();
        probe.onload = () => {
          window.location.replace(target);
        };
        probe.onerror = () => {
          setTimeout(tryConnect, 80);
        };
        probe.src = `${target}/assets/app-icon.ico?${Date.now()}`;
      }

      tryConnect();
    </script>
  </body>
</html>
